# La app, publicada por CI. Nunca se commitea el compilado: se construye aquí y
# se sube directo a Pages, que es lo que evita las tres copias sin etiqueta del
# repositorio viejo.
#
# Salen DOS versiones de la misma app, y una portada que ofrece las dos:
#
#     https://eslmilan-sys.github.io/partimos/        la portada
#     https://eslmilan-sys.github.io/partimos/app/    contra la base real
#     https://eslmilan-sys.github.io/partimos/demo/   la fuente simulada
#
# La demo existe porque probar TODO contra la base real todavía no se puede:
# treinta y siete pantallas llevan el identificador del recorrido de
# demostración escrito a mano (app/README.md, «Ce qui manque», punto 1) y
# contra Supabase salen vacías. Con la fuente simulada cada pantalla, cada
# botón y cada cálculo se recorren enteros, sin cuenta y sin red. Cuando el
# punto 1 esté cerrado, la demo se podrá retirar.
#
# La dirección real tiene que estar en «Redirect URLs» del proyecto Supabase,
# o el enlace de confirmación del correo vuelve a la Site URL y cae en una
# página de error.

name: App

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

# Lo que Pages necesita para aceptar el envío. `id-token` es el que firma.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; el que llega después espera, no cancela al de en medio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # Las reglas de negocio y el contrato de tipos antes que nada: publicar
      # algo que no compila es publicar una pantalla en blanco.
      - run: npm run typecheck
      - run: npm test

      - name: Exportar contra la base real
        env:
          # Estas llaves son públicas a propósito —lo que protege los datos son
          # las políticas RLS, no el secreto de una cadena compilada en el
          # paquete—. Van aquí en claro por la misma razón que en .env.example.
          EXPO_PUBLIC_SUPABASE_URL: https://zcwueglgirqxwazhfidi.supabase.co
          EXPO_PUBLIC_SUPABASE_LLAVE: sb_publishable_isfWgZ9aT6QTUDtubxr_Iw_xdPLvp9e
          # Contra la base de verdad. Es el objetivo: que quien pruebe vea sus
          # propios datos y no el recorrido del traspaso.
          EXPO_PUBLIC_FUENTE: supabase
          # Sin jeton, la búsqueda de sitios ofrece el campo libre en vez de
          # sugerencias. Se pone como secreto del repositorio cuando exista.
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          # El subcamino de Pages. Solo al exportar: `npx expo start` sigue
          # sirviendo desde la raíz.
          PARTIMOS_BASE_URL: /partimos/app/
        run: npx expo export --platform web --output-dir dist

      # La misma app, con la fuente simulada: cada pantalla se recorre entera
      # sin cuenta, sin red y sin depender de lo que haya sembrado en la base.
      - name: Exportar la demo
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://zcwueglgirqxwazhfidi.supabase.co
          EXPO_PUBLIC_SUPABASE_LLAVE: sb_publishable_isfWgZ9aT6QTUDtubxr_Iw_xdPLvp9e
          EXPO_PUBLIC_FUENTE: simulado
          # La démo aussi : c'est le lien qu'on envoie aux amis, et chercher
          # un lieu est une des choses qu'ils doivent pouvoir éprouver.
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          PARTIMOS_BASE_URL: /partimos/demo/
        run: npx expo export --platform web --output-dir dist-demo

      # Pages sirve lo que se le sube tal cual. La app cuelga de /app/, la demo
      # de /demo/, y en la raíz va la portada que ofrece las dos — hasta que el
      # sitio de `web/` reclame ese lugar.
      - name: Componer lo que se publica
        run: |
          mkdir -p ../publicar/app ../publicar/demo
          cp -r dist/. ../publicar/app/
          cp -r dist-demo/. ../publicar/demo/
          cp ../.github/pages/index.html ../publicar/index.html

      # Sin esto, GitHub Pages pasa la carpeta por Jekyll y se come todo lo que
      # empieza por guion bajo — que es donde Expo deja el paquete.
      - run: touch ../publicar/.nojekyll

      # La red de seguridad del enrutado. Pages resuelve `/app/resultados`
      # contra `resultados.html`, pero cuando NO lo consigue —un camino que el
      # export no escribió, una ruta con parámetro que alguien pega tal cual—
      # sirve su propio 404, no el nuestro, y `app/+not-found.tsx` nunca llega a
      # ejecutarse porque el paquete no se ha cargado todavía. Con un 404.html
      # que es la propia app, ese caso entra por la puerta y el enrutador
      # resuelve el camino del lado del navegador. El 404 de la raíz manda a la
      # versión real, que es la dirección que se comparte.
      - name: El 404 tambien es la app
        run: |
          cp dist/index.html ../publicar/app/404.html
          cp dist-demo/index.html ../publicar/demo/404.html
          cp dist/index.html ../publicar/404.html

      # Pages tiene que estar encendido a mano una vez: Settings -> Pages ->
      # Source: «GitHub Actions». La accion no puede encenderlo ella misma
      # —«Create Pages site failed: Resource not accessible by integration»,
      # medido—, porque el GITHUB_TOKEN del flujo no tiene ese permiso.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publicar

  # Solo main despliega: el entorno github-pages rechaza a las demás ramas
  # —«Branch is not allowed to deploy», medido en los runs 42-45—. En una rama
  # el flujo se queda en construir, que ya vale como comprobación: si el export
  # rompe, se sabe antes de fusionar.
  publicar:
    if: github.ref == 'refs/heads/main'
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
